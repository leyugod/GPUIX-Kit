name: Bug report
description: Report a reproducible component or adapter issue
body:
  - type: input
    id: version
    attributes:
      label: gpuixKit / GPUIX / Bun versions
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code and expected/actual behavior; remove private data and credentials.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
